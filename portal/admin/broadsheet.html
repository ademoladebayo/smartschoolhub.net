<html lang="en">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Student's Academic Record</title>
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open Sans&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Libre+Barcode+128&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nova+Flat&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nova+Square&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Quicksand&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Rhodium+Libre&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Scope+One&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Share+Tech+Mono&amp;display=swap">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <!-- QR LIBRARY -->
    <script type="text/javascript" src="./js/adapter.min.js"></script>

    <script type="text/javascript" src="./js/vue.min.js"></script>

    <script type="text/javascript" src="./js/instascan.min.js"></script>
</head>

<body style="font-family: Poppins; font-weight: bold;" style="background: #ffffff;" onload="getBroadsheet()">


    <div class="w-100" style="background: var(--bs-blue);margin-bottom: 5px;"></div>
    <section>
        <div style="float: right;" class="header-inline item-header">

        </div>

        <div style="border: 2px solid black;margin: 0%;" class="result-page">
            <!-- SCHOOL LOGO-->
            <div class="container">
                <div class="row">
                    <div class="col-md-4 col-lg-3">

                    </div>
                    <div class="col-md-4 col-lg-6">
                        <div class="text-center" style="margin-top: 2px;margin-bottom: 10px;"><img id="school_logo"
                                src="../assets/img/sample_logo.png" height="150px" width="130px"></div>

                    </div>
                    <div class="col-md-4 col-lg-3">

                    </div>
                </div>
            </div>


            <!-- RESULT HEADER -->
            <div class="container">

                <div class="row">
                    <div class="col-md-4">

                    </div>
                    <div class="col-md-4">
                        <div class="text-center" style="margin-right: 0px;margin-left: 0px;margin-top: 0px;">
                            <h5 style="font-weight: bold;font-family: Poppins, serif;">STUDENT<br>ACADEMIC BROADSHEET
                            </h5>

                            <p id="school_details"
                                style="font-size: 14px;font-family: Poppins; justify-content: center; display: flex;">
                                <b>_____________________________</b>
                            </p>
                        </div>
                    </div>

                    <div class="w-100" style="margin-bottom: 0px;"></div>
                </div>
            </div>



            <div id="result_div">

                <div id="result_${session}_${term}" name="result_${session}_${term}" class="container result_container"
                    style="margin-bottom: 30px;">
                    <div style="border:1px solid black; padding-bottom: 15px;" class="row">

                        <div class="col-md-4">
                            <div style="text-align: left;margin-top: 30px;margin-left: 50px;">
                                <h6 style="font-size: 15px;">CLASS: <strong id="class__"></strong></h6>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div style="text-align: left;margin-top: 30px;margin-left: 50px;">
                                <h6 style="font-size: 15px;">SESSION: <strong id="session"></strong></h6>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div style="text-align: left;margin-top: 30px;margin-left: 50px;">
                                <h6 style="font-size: 15px;">TERM: <strong id="term"></strong></h6>
                            </div>
                        </div>


                        <div style="margin-top: 15px;" class="col-md-12 col-lg-12 col-xl-12">
                            <div style="margin-top: 0px;">
                                <div class="card">
                                    <div class="card-body">

                                        <!-- SCORE TABLE -->
                                        <div class="table-responsive">
                                            <table style="padding: 0%;" class="table table-sm">
                                                <thead>
                                                    <tr id="header">

                                                       


                                                    </tr>
                                                </thead>
                                                <tbody id="broadsheet">

                                                    <hr style="color: black; border: 1px solid black">
                                                    <h3 style="text-align: center;">NO RESULT AVAILABLE</h3>
                                                    <hr style="color: black; border: 1px solid black">

                                                </tbody>
                                            </table>
                                        </div>


                                    </div>
                                </div>
                            </div>
                        </div>


                    </div>

                </div>






            </div>


            <!-- RESULT FOOTER -->
            <div class="container">
                <div class="alert alert-primary" role="alert"
                    style="padding-top: 5px;padding-bottom: 5px;background: #ade7ff;">
                    <div class="text-center"><span
                            style="font-size: 12px;color: #006089 !important;font-family: Poppins, serif;"><strong>ANY
                                OFFICIAL
                                BROADSHEET MUST BE SIGNED BY THE PRINCIPAL</strong></span></div>
                </div>

            </div>
        </div>














        <div class="text-center" style="height: 5px;background: #ffffff;margin-bottom: 15px;">
            <div class="w-100" style="background: var(--bs-blue);margin-bottom: 5px;"></div>
        </div>
    </section>
    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="../js/jquery-3.3.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="../js/iframeSizer.contentWindow.min.js"></script>
    <script src="./js/qrcode.min.js"></script>
    <script src="./js/admin.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-U1DAWAznBHeqEIlVSCgzq+c9gqGAJn5c/t99JyeKa9xxaYpSvHU5awsuZVVFIhvj"
        crossorigin="anonymous"></script>
    <!-- jquery-->
    <script src="../js/jquery-3.3.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <!-- Plugins js -->
    <script src="../js/plugins.js"></script>
    <!-- Popper js -->
    <script src="../js/popper.min.js"></script>
    <!-- Bootstrap js -->
    <script src="../js/bootstrap.min.js"></script>
    <!-- Counterup Js -->
    <script src="../js/jquery.counterup.min.js"></script>
    <!-- Moment Js -->
    <script src="../js/moment.min.js"></script>
    <!-- Waypoints Js -->
    <script src="../js/jquery.waypoints.min.js"></script>
    <!-- Scroll Up Js -->
    <script src="../js/jquery.scrollUp.min.js"></script>
    <!-- Full Calender Js -->
    <script src="../js/fullcalendar.min.js"></script>
    <!-- Select 2 Js -->
    <script src="../js/select2.min.js"></script>
    <!-- Chart Js -->
    <script src="../js/Chart.min.js"></script>
    <!-- Data Table Js -->
    <!-- <script src="../js/jquery.dataTables.min.js"></script> -->
    <script src="https://cdn.datatables.net/1.13.1/js/jquery.dataTables.min.js"></script>
    <!-- Custom Js -->
    <script src="../js/main.js"></script>
    <script src="../js/myscript.js"></script>
    <script src="./js/admin.js"></script>
    <script src="../common-library.js?v=1.0"></script>

    <script src="../assets/js/lib/toastr/toastr.min.js"></script>
    <script src="../assets/js/lib/toastr/toastr.init.js"></script>
    <script src="../assets/js/lib/sweetalert/sweetalert.min.js"></script>
    <script src="../assets/js/lib/sweetalert/sweetalert.init.js"></script>
    <style>
        table,
        th,
        td,
        tr {
            border: 1px solid black;
            border-collapse: collapse;
        }

        .table {
            border: black;
        }

        .vertical-header {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            height: 120px;
            width: 30px;
            padding: 5px;
            vertical-align: middle;
        }
    </style>

    <style id="result_upload_style">
        [contenteditable] {

            outline-color: #105c05;
        }
    </style>


</body>

</html>
